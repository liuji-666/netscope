[package]
name = "netscope"
version = "0.1.0"
edition = "2021"
description = "Modern network diagnostics CLI — one command, full picture"
license = "MIT"
readme = "README.md"
keywords = ["network", "diagnostics", "cli", "ping", "traceroute"]
categories = ["command-line-utilities", "network-programming"]
authors = ["NetScope Team"]
repository = "https://github.com/liuji666/netscope"
homepage = "https://github.com/liuji666/netscope"

[[bin]]
name = "netscope"
path = "src/main.rs"

[lib]
name = "netscope_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "wrap_help"] }
tokio = { version = "1", features = ["full"] }
colored = "2"
tabled = "0.17"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
url = "2"
ipnet = "2"
dirs = "5"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
strip = true